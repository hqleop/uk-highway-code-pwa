{% extends "base.html" %}
{% block title %}Login | UK Highway Code{% endblock %}
{% block content %}
<section class="auth-panel auth-panel-narrow">
  <h1>Login</h1>
  <form method="post" class="stack-form">
    {% csrf_token %}
    {% for field in form %}
      <label>
        {{ field.label }}
        {{ field }}
        {% if field.errors %}<span class="field-error">{{ field.errors|striptags }}</span>{% endif %}
      </label>
    {% endfor %}
    {% if form.non_field_errors %}<p class="field-error">{{ form.non_field_errors|striptags }}</p>{% endif %}
    <button class="button primary" type="submit" data-icon="log-in">Login</button>
  </form>
  <p class="muted">New here? <a href="{% url 'accounts:register' %}">Create an account</a>.</p>
</section>
{% endblock %}
