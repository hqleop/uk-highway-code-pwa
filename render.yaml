databases:
  - name: uk-highway-code-pwa-db
    plan: free
    databaseName: highway_code
    user: highway_code

services:
  - type: web
    name: uk-highway-code-pwa
    runtime: python
    plan: free
    buildCommand: bash ./build.sh
    preDeployCommand: python manage.py migrate && python manage.py seed_quiz
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: uk-highway-code-pwa-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_EMAIL
        value: admin@example.com
